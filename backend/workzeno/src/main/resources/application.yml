spring:
  application:
    name: workzeno

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

logging:
  level:
    com.workzeno.workzeno: DEBUG
    org.springframework.security: INFO

workzeno:
  security:
    jwt:
      # Must be supplied through the environment.
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: workzeno-api
      access-token-ttl: 15m


