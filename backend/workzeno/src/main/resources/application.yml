springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
    path: /swagger-ui.html
  packages-to-scan: com.workzeno.workzeno

spring:

  application:
    name: workzeno

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

app:
  collaboration:
    invitation:
      ttl: 7d
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}
  auth:
    refresh-token:
      ttl: 7d
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}

logging:
  level:
    root: INFO
    com.workzeno.workzeno: INFO
    org.springframework.security: INFO
    org.hibernate: WARN
    org.flywaydb: INFO

workzeno:
  security:
    jwt:
      # Must be supplied through the environment.
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: workzeno-api
      access-token-ttl: 15m

  bootstrap-admin:
    enabled: ${WORKZENO_BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${WORKZENO_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${WORKZENO_BOOTSTRAP_ADMIN_PASSWORD:}
