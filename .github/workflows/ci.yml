name: Workzeno CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: workzeno
          POSTGRES_USER: workzeno
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workzeno -d workzeno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/workzeno
      DB_USERNAME: workzeno
      DB_PASSWORD: test-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/workzeno/pom.xml

      - name: Make Maven Wrapper executable
        working-directory: backend/workzeno
        run: chmod +x mvnw

      - name: Run Maven verification
        working-directory: backend/workzeno
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run component tests
        working-directory: frontend
        run: npm test

      - name: Build production frontend
        working-directory: frontend
        run: npm run build
